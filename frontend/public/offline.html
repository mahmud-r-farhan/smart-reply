<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Smart Reply</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .offline-container {
      background: rgba(30, 27, 75, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      margin: 0 auto 24px;
      animation: pulse 2s infinite;
    }

    .icon-wrapper svg {
      width: 48px;
      height: 48px;
      color: #6366f1;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    .status-text {
      font-size: 12px;
      color: #ef4444;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-refresh {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-refresh:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    .btn-refresh:active {
      transform: translateY(0);
    }

    .btn-home {
      background: transparent;
      color: #6366f1;
      border: 1px solid #6366f1;
    }

    .btn-home:hover {
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    .btn-home:active {
      transform: translateY(0);
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner.active {
      display: inline-block;
    }

    .info-text {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 24px;
    }

    @media (max-width: 480px) {
      .offline-container {
        padding: 32px 20px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="icon-wrapper">

    </g>
    </svg>
    </div>

    <div class="status-indicator">
      <span class="status-dot"></span>
      <span class="status-text">No Connection</span>
    </div>

    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please check your network and try again.</p>

    <div class="button-group">
      <button class="btn-refresh" onclick="reconnect()">
        <span class="spinner" id="spinner"></span>
        <span id="btn-text">Reconnect</span>
      </button>
      <button class="btn-home" onclick="goHome()">Go to Home</button>
    </div>

    <div class="info-text">
      Your data is saved locally and will sync when you're back online.
    </div>
  </div>

  <script>
    function reconnect() {
      const btn = document.querySelector('.btn-refresh');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true;
      spinner.classList.add('active');
      btnText.textContent = 'Checking...';

      // Check if connection is restored
      const checkConnection = setInterval(() => {
        fetch(new Request('/', { method: 'HEAD', cache: 'no-store' }))
          .then((response) => {
            if (response.ok || response.status === 0) {
              clearInterval(checkConnection);
              btnText.textContent = 'Connected!';
              spinner.classList.remove('active');
              setTimeout(() => {
                window.location.href = '/';
              }, 500);
            }
          })
          .catch(() => {
            // Still offline, continue checking
          });
      }, 1000);

      // Fallback: refresh after 5 seconds regardless
      setTimeout(() => {
        clearInterval(checkConnection);
        window.location.reload();
      }, 5000);
    }

    function goHome() {
      window.location.href = '/';
    }

    // Check if online and redirect
    if (navigator.onLine) {
      window.location.href = '/';
    }

    // Listen for online event
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
